name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the rolling "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable   # the exec bit is lost when files are uploaded through the web UI
        run: chmod +x gradlew

      # The signing key lives only in this repo's private Actions cache. It is created
      # on the first run; later runs reuse it so that APK updates install over each other.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/ci-signing
          key: signing-key-v1

      - name: Create signing key (first run only)
        run: |
          if [ ! -f "$HOME/ci-signing/release.jks" ]; then
            mkdir -p "$HOME/ci-signing"
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$HOME/ci-signing/release.jks" -alias calltranscriber \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=CallTranscriber personal build"
            printf '%s' "$PASS" > "$HOME/ci-signing/pass.txt"
          fi
          PASS="$(cat "$HOME/ci-signing/pass.txt")"
          echo "::add-mask::$PASS"
          echo "CT_KEYSTORE_FILE=$HOME/ci-signing/release.jks" >> "$GITHUB_ENV"
          echo "CT_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CallTranscriber-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # A release asset can be downloaded straight from the phone's browser (an
      # Actions artifact is a zip and needs a GitHub login).
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallTranscriber.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CallTranscriber.apk \
            --title "Latest build" \
            --notes "Build from commit ${GITHUB_SHA::7}" \
            --prerelease

  # Runs the JNI bridge against whisper.cpp on the CI machine (no phone needed) with its tiny random
  # test model, to catch crashes in the native code path.
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch whisper.cpp
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"

      - name: Build the JNI library for this machine
        run: |
          export WHISPER_CPP_DIR="$RUNNER_TEMP/whisper.cpp"
          cmake -S app/src/main/cpp -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build" --target calltranscriber -j 4

      - name: Download a real tiny model and the real VAD model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/ggml-tiny.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/ggml-silero-v5.1.2.bin" \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          ls -la "$RUNNER_TEMP/models"

      - name: Run smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          javac -d "$RUNNER_TEMP/out" native-test/il/calltranscriber/whisper/*.java native-test/Smoke.java
          W="$RUNNER_TEMP/whisper.cpp"
          java -Djava.library.path="$RUNNER_TEMP/build" -cp "$RUNNER_TEMP/out" Smoke \
            "$W/models/for-tests-ggml-tiny.bin" "$W/models/for-tests-silero-v6.2.0-ggml.bin" "$W/samples/jfk.wav" \
            "$RUNNER_TEMP/models/ggml-tiny.bin" "$RUNNER_TEMP/models/ggml-silero-v5.1.2.bin"

      # Informational: do the download URLs built into the app resolve? (HEAD request, follows redirects)
      - name: Check the app's model download URLs
        continue-on-error: true
        run: |
          for u in \
            https://huggingface.co/ivrit-ai/whisper-large-v3-turbo-ggml/resolve/main/ggml-model.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin ; do
            code=$(curl -sIL -o /dev/null -w '%{http_code} %{size_download}' "$u" || echo "curl-failed")
            len=$(curl -sIL "$u" | grep -i '^content-length:' | tail -1 | tr -d '\r')
            echo "URL-CHECK $code | $len | $u"
          done
          echo "--- files in the ivrit-ai ggml repos (API):"
          for r in whisper-large-v3-turbo-ggml whisper-large-v3-ggml; do
            echo "repo ivrit-ai/$r:"
            curl -s "https://huggingface.co/api/models/ivrit-ai/$r" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join('  '+x['rfilename'] for x in d.get('siblings',[])) or d)" 2>&1 | head -20
          done
